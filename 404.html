<head>

  <script>
    var path = window.location.pathname.replace(/^\/+/, '');
    if (path.startsWith('scholarship-platform/')) {
      // Nothing needed
    } else if (path === 'scholarship' || path === 'scholarship/' || path === 'scholarships' || path === 'scholarships/') {
      window.location.replace('https://toulatimehdi2004-tech.github.io/scholarship-platform/scholarships/');

      window.location.replace('https://toulatimehdi2004-tech.github.io/scholarship-platform/' + path + window.location.search);
    }
  </script>
